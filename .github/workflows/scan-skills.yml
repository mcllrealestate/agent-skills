name: scan-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@c615acb70994cdf3f4ba54d955fef2e92ac84437 # 2.3.1
    permissions:
      contents: read
      security-events: write
    with:
      skill_path: skills
      policy: balanced
      fail_on_severity: critical
