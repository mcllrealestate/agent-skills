name: scan-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@e4e334f03a673015a088febc0e2c566087aeb327 # 2.3.0
    permissions:
      contents: read
      security-events: write
    with:
      skill_path: skills
      policy: balanced
      fail_on_severity: critical
