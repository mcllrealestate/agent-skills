name: scan-skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  scan:
    name: scan
    uses: cisco-ai-defense/skill-scanner/.github/workflows/scan-skills.yml@a49c8d9f7555dd99a9f5e4430c3bb8d4fe4a9371 # 2.0.14
    permissions:
      contents: read
      security-events: write
    with:
      skill_path: skills
      policy: balanced
      fail_on_severity: critical
